apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

sortOptions:
  order: legacy
  legacySortOptions:
    orderFirst:
    - Namespace
    - ResourceQuota
    - StorageClass
    - CustomResourceDefinition
    - MutatingWebhookConfiguration
    - ServiceAccount
    - PodSecurityPolicy
    - NetworkPolicy
    - Role
    - ClusterRole
    - RoleBinding
    - ClusterRoleBinding
    - ConfigMap
    - Secret
    - Endpoints
    - Service
    - LimitRange
    - PriorityClass
    - PersistentVolume
    - PersistentVolumeClaim
    - Deployment
    - StatefulSet
    - CronJob
    - PodDisruptionBudget
    orderLast:
    - ValidatingWebhookConfiguration

resources:
# Cert-Manager
- ../common/cert-manager/base
- ../common/cert-manager/overlays/kubeflow
# Istio
- ../common/istio/istio-crds/base
- ../common/istio/istio-namespace/base
- ../common/istio/istio-install/overlays/oauth2-proxy
# Oauth2-proxy (EKS: also accepts EKS service-account JWTs; AWS_REGION and
# CLUSTER_ID in the issuer are substituted per cluster)
- ../common/oauth2-proxy/overlays/m2m-dex-and-eks
# Dex
- ../common/dex/overlays/oauth2-proxy
# KNative
- ../common/knative/knative-serving/overlays/gateways
- ../common/knative/knative-eventing/base
- ../common/istio/cluster-local-gateway/base
# Kubeflow namespace
- ../common/kubeflow-namespace/base
# Kubeflow Roles
- ../common/kubeflow-roles/base
# Kubeflow Istio Resources
- ../common/istio/kubeflow-istio-resources/base
# Kubeflow Pipelines with external S3 (IRSA) and MySQL instead of the
# in-cluster SeaweedFS and MySQL
- ../applications/pipeline/upstream/env/aws
# Katib
- ../applications/katib/upstream/installs/katib-with-kubeflow
# Central Dashboard
- ../applications/dashboard/overlays/istio
# User namespace
- ../common/user-namespace/base
# KServe
- ../applications/kserve/kserve
- ../applications/kserve/kserve-ui


# Not deployed: Workspaces, Notebooks v1, Trainer, Spark Operator and Hub.

patches:
# KServe's validating webhook rejects a multinode runtime with fewer than two
# pipeline stages (one head plus one worker), so the bundled default of 1
# cannot be applied.
- patch: |-
    - op: replace
      path: /spec/workerSpec/pipelineParallelSize
      value: 2
  target:
    group: serving.kserve.io
    kind: ClusterServingRuntime
    name: kserve-huggingfaceserver-multinode
- patch: |-
    apiVersion: v1
    kind: Namespace
    metadata:
      name: istio-system
      labels:
        elbv2.k8s.aws/pod-readiness-gate-inject: enabled
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: profiles-deployment
      namespace: kubeflow
    spec:
      template:
        spec:
          containers:
          - name: manager
            env:
            - name: AWS_REGION
              value: us-west-2
