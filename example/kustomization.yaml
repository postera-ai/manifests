apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

sortOptions:
  order: legacy
  legacySortOptions:
    orderFirst:
    - Namespace
    - ResourceQuota
    - StorageClass
    - CustomResourceDefinition
    - MutatingWebhookConfiguration
    - ServiceAccount
    - PodSecurityPolicy
    - NetworkPolicy
    - Role
    - ClusterRole
    - RoleBinding
    - ClusterRoleBinding
    - ConfigMap
    - Secret
    - Endpoints
    - Service
    - LimitRange
    - PriorityClass
    - PersistentVolume
    - PersistentVolumeClaim
    - Deployment
    - StatefulSet
    - CronJob
    - PodDisruptionBudget
    orderLast:
    - ValidatingWebhookConfiguration

resources:
# Cert-Manager
- ../common/cert-manager/base
- ../common/cert-manager/overlays/kubeflow
# Istio
- ../common/istio/istio-crds/base
- ../common/istio/istio-namespace/base
- ../common/istio/istio-install/overlays/oauth2-proxy
# Oauth2-proxy — EKS overlay (allows EKS-OIDC m2m JWTs for gateway auth).
# On EKS we use m2m-dex-and-eks (NOT the stock m2m-dex-only). The
# m2m-token-issuer RequestAuthentication issuer/jwksUri carry the
# AWS_REGION/CLUSTER_ID placeholders, substituted per-cluster downstream.
- ../common/oauth2-proxy/overlays/m2m-dex-and-eks
# Dex
- ../common/dex/overlays/oauth2-proxy
# KNative
- ../common/knative/knative-serving/overlays/gateways
- ../common/knative/knative-eventing/base
- ../common/istio/cluster-local-gateway/base
# Kubeflow namespace
- ../common/kubeflow-namespace/base
# Kubeflow Roles
- ../common/kubeflow-roles/base
# Kubeflow Istio Resources
- ../common/istio/kubeflow-istio-resources/base
# Kubeflow Pipelines — external S3 + RDS MySQL (IRSA), NOT the SeaweedFS/MinIO
# default. The env/aws overlay layers on cert-manager/platform-agnostic-multi-user,
# points KFP at S3 (fromEnv IRSA) + RDS (argo_archive), and the in-cluster
# mysql/seaweedfs backends are commented out of env/platform-agnostic-multi-user.
- ../applications/pipeline/upstream/env/aws
# Katib
- ../applications/katib/upstream/installs/katib-with-kubeflow
# Central Dashboard (v2 bundle = centraldashboard + profile-controller/KFAM +
# admission-webhook/PodDefaults; replaces the three separate legacy entries)
- ../applications/dashboard/overlays/istio
# Notebooks v1 — reference the two sub-apps we keep DIRECTLY, NOT the
# notebooks-v1/overlays/istio bundle (which pulls all 6 notebook sub-apps).
- ../applications/notebooks-v1/upstream/pvcviewer-controller/base
- ../applications/notebooks-v1/upstream/volumes-web-app/overlays/istio
# User namespace
- ../common/user-namespace/base
# KServe
- ../applications/kserve/kserve
- ../applications/kserve/models-web-app/overlays/kubeflow

# OMITTED (decided 2026-06-24, see plan §7): jupyter/notebook-controller,
# tensorboard×2, training-operator v1, spark, Trainer v2 (single-node training
# only), Hub model-registry + model-catalog (MLflow already covers it),
# Workspaces (pre-GA). None are dependencies of the kept apps.
