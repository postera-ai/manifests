# Upstream is https://github.com/dexidp/dex/blob/master/examples/k8s/dex.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth

resources:
- namespace.yaml
- config-map.yaml
- upstream/crds.yaml
- rbac.yaml
- serviceaccount.yaml
- deployment.yaml
- service.yaml
- dex-passwords.yaml
- pod-disruption-budget.yaml

patches:
- path: patches/topology-spread.yaml

generatorOptions:
  disableNameSuffixHash: true

# The dex-oidc-client Secret is provided out-of-band by the provisioning layer;
# do not generate a colliding copy that would overwrite the managed credentials.
