apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../istio
- default-allow-same-namespace.yaml
- allow-istio-and-oauth2-proxy.yaml

patches:
- path: config-map.yaml
  target:
    version: v1
    kind: ConfigMap
    name: dex
    namespace: auth
# The dex-passwords Secret is created out-of-band (lifecycle ignore_changes);
# delete the base placeholder so the externally-managed one is authoritative.
- path: delete-dex-passwords-secret.yaml
