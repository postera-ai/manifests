apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: <changeme-stack-admin-email>
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          route53:
            region: us-west-2
            role: <changeme-IAM-role-for-kubeflow-cert-manager-in-r53-account-arn>
            hostedZoneID: <changeme-R53-hosted-zone-id>
            auth:
              kubernetes:
                serviceAccountRef:
                  name: cert-manager
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kubeflow-tls
  namespace: istio-system
spec:
  secretName: kubeflow-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "<changeme-default-domain>"
  dnsNames:
    - "<changeme-default-domain>"
    - "*.<changeme-default-user-namespace>.<changeme-default-domain>"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-tokenrequest
  namespace: cert-manager
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  resourceNames:
  - cert-manager
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-tokenrequest
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-tokenrequest
subjects:
- kind: ServiceAccount
  name: cert-manager
  namespace: cert-manager
