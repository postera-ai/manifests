# Kubeflow Pipelines 2.18 authorizes shared pipeline uploads (no namespace)
# against the API server's own namespace. Let the default user keep publishing
# shared pipelines.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-pipeline-publisher
  namespace: kubeflow
rules:
- apiGroups:
  - pipelines.kubeflow.org
  resources:
  - pipelines
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-pipeline-publisher
  namespace: kubeflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shared-pipeline-publisher
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: $(user)
