apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-controller
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workflow-controller
          image: quay.io/argoproj/workflow-controller:v3.7.3
          args:
            - --configmap
            - workflow-controller-configmap
            - --executor-image
            - quay.io/argoproj/argoexec:v3.7.3
            - --log-format
            - json
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # Unlimited, a status blob it cannot persist grew this to 8.8GB and cost the whole node.
          # No cpu limit on purpose: throttling the reconcile loop only lengthens a backlog.
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 1Gi
