apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline
spec:
  template:
    metadata:
      labels:
        app: ml-pipeline
    spec:
      containers:
        - env:
            - name: OBJECTSTORECONFIG_SECURE
              value: "true"
            - name: OBJECTSTORECONFIG_BUCKETNAME
              valueFrom:
                configMapKeyRef:
                  name: pipeline-install-config
                  key: bucketName
            - name: OBJECTSTORECONFIG_HOST
              value: null
              valueFrom:
                configMapKeyRef:
                  name: pipeline-install-config
                  key: minioServiceHost
            - name: OBJECTSTORECONFIG_REGION
              valueFrom:
                configMapKeyRef:
                  name: pipeline-install-config
                  key: minioServiceRegion
            - name: OBJECTSTORECONFIG_PORT
              value: ""
            - name: OBJECTSTORECONFIG_ACCESSKEY
              value: ""
              valueFrom: null
            - name: OBJECTSTORECONFIG_SECRETACCESSKEY
              value: ""
              valueFrom: null
          name: ml-pipeline-api-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-pipeline
  annotations:
    eks.amazonaws.com/role-arn: <changeme-IAM-role-for-ml-pipeline-arn>